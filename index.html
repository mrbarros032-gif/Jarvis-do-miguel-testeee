<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS V2.1</title>

<style>
* {margin:0;padding:0;box-sizing:border-box;}

body {
    background:#000;
    color:#fff;
    font-family:'Segoe UI', sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
}

.header {
    padding:16px;
    border-bottom:1px solid #1A1A1A;
}

.app-badge {
    background:#1C1C1C;
    border-radius:20px;
    padding:8px 16px;
    display:inline-flex;
    align-items:center;
    gap:8px;
}

.status-dot {
    width:10px;
    height:10px;
    background:#00D26A;
    border-radius:50%;
}

.main {
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px;
    overflow:hidden;
}

.logo {
    width:80px;
    height:80px;
    margin:10px auto;
    background:radial-gradient(circle,#B18AFF,#7C3AED);
    border-radius:50%;
}

.title {
    text-align:center;
    margin-bottom:10px;
}

#chat {
    flex:1;
    overflow-y:auto;
    margin-bottom:10px;
}

.msg {
    max-width:80%;
    padding:10px;
    margin:6px 0;
    border-radius:12px;
    white-space:pre-wrap;
}

.user {
    background:#7C3AED;
    margin-left:auto;
    text-align:right;
}

.bot {
    background:#1A1A1A;
    margin-right:auto;
}

.input-container {
    background:#1A1A1A;
    border-radius:16px;
    padding:16px;
    position:relative;
}

.input-field {
    width:100%;
    background:none;
    border:none;
    color:#fff;
    outline:none;
}

.send-btn {
    position:absolute;
    right:16px;
    bottom:16px;
    background:none;
    border:none;
    color:#888;
    cursor:pointer;
}
</style>
</head>

<body>

<header class="header">
    <div class="app-badge">
        <span class="status-dot"></span>
        JARVIS V2.1
    </div>
</header>

<main class="main">

<div class="logo"></div>
<h2 class="title">Por onde começamos?</h2>

<div id="chat"></div>

<div class="input-container">
<textarea id="input" class="input-field" placeholder="Envie uma mensagem..."></textarea>
<button id="botao" class="send-btn">➤</button>
</div>

</main>

<script src="script.js"></script>

</body>
</html>
